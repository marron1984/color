<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飲食店専門 人材マッチングシステム</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">🍽</span>
      <div>
        <h1>飲食店専門 人材マッチング</h1>
        <p class="tagline">店舗ニーズに応じて ホール・キッチン・店長 などの人材を AI がピックアップ</p>
      </div>
    </div>
    <div id="llm-badge" class="badge badge-muted">AI: 確認中…</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="match">🎯 マッチング</button>
    <button class="tab" data-tab="jobs">📋 求人</button>
    <button class="tab" data-tab="talents">🧑‍🍳 人材</button>
    <button class="tab" data-tab="clients">🏬 店舗</button>
  </nav>

  <datalist id="positions">
    <option value="ホール"></option>
    <option value="キッチン"></option>
    <option value="調理長"></option>
    <option value="店長"></option>
    <option value="副店長"></option>
    <option value="バリスタ"></option>
    <option value="寿司職人"></option>
    <option value="パティシエ"></option>
    <option value="ソムリエ"></option>
    <option value="キッチン補助"></option>
  </datalist>

  <main>
    <!-- ========== マッチング ========== -->
    <section id="tab-match" class="tab-panel active">
      <div class="panel">
        <h2>AI マッチング</h2>
        <p class="hint">求人を選ぶと、登録人材の適合度をスコアリングし上位候補を提案します。</p>
        <div class="row">
          <label>求人
            <select id="match-job"></select>
          </label>
          <label>候補数
            <input id="match-topn" type="number" value="5" min="1" max="50" />
          </label>
          <label class="checkbox">
            <input id="match-llm" type="checkbox" checked /> AI 推薦理由を生成
          </label>
          <button id="run-match" class="primary">ピックアップ実行</button>
        </div>
      </div>
      <div id="match-results" class="results"></div>
    </section>

    <!-- ========== 求人 ========== -->
    <section id="tab-jobs" class="tab-panel">
      <div class="grid-2">
        <div class="panel">
          <h2>求人登録</h2>
          <form id="job-form">
            <label>店舗<select id="job-client" required></select></label>
            <label>求人タイトル<input name="title" required placeholder="ホールスタッフ（週末中心）" /></label>
            <label>必須スキル（1行1件: 名称,重み,最低レベル）
              <textarea name="required_skills" rows="3" placeholder="ホール接客,3,3&#10;レジ,1,2"></textarea>
            </label>
            <div class="row">
              <label>提示年収(万円)<input name="offered_salary" type="number" value="0" /></label>
              <label>職種<input name="type_os" list="positions" placeholder="ホール／キッチン／店長 など" /></label>
            </div>
            <div class="row">
              <label>勤務形態
                <select name="work_style">
                  <option value="onsite">店舗勤務</option>
                  <option value="online">オンライン</option>
                  <option value="both">どちらも</option>
                </select>
              </label>
              <label>勤務地<input name="location" placeholder="東京" /></label>
              <label>募集人数<input name="headcount" type="number" value="1" /></label>
            </div>
            <label>説明<textarea name="description" rows="2"></textarea></label>
            <button class="primary" type="submit">登録</button>
          </form>
        </div>
        <div class="panel">
          <h2>求人一覧</h2>
          <div id="jobs-list" class="list"></div>
        </div>
      </div>
    </section>

    <!-- ========== 人材 ========== -->
    <section id="tab-talents" class="tab-panel">
      <div class="grid-2">
        <div class="panel">
          <h2>人材登録</h2>
          <div class="resume-box">
            <div class="rb-title">📄 履歴書から自動入力</div>
            <div class="rb-desc">PDF・画像・テキストの履歴書／職務経歴書を読み込んでフォームに反映します（内容は登録前に確認・修正できます）。</div>
            <div class="resume-row">
              <input id="resume-file" type="file"
                     accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,application/pdf,image/*,text/plain" />
              <button type="button" id="resume-btn" class="secondary">読み込む</button>
              <span id="resume-status" class="resume-status"></span>
            </div>
          </div>
          <form id="talent-form">
            <div class="row">
              <label>氏名<input name="name" required placeholder="佐藤 みなみ" /></label>
              <label>フリガナ<input name="kana" placeholder="サトウ ミナミ" /></label>
            </div>
            <label>スキル（1行1件: 名称,レベル1-5）
              <textarea name="skills" rows="3" placeholder="ホール接客,5&#10;調理,4"></textarea>
            </label>
            <div class="row">
              <label>経験年数<input name="experience_years" type="number" step="0.5" value="0" /></label>
              <label>希望年収(万円)<input name="desired_salary" type="number" value="0" /></label>
              <label>職種<input name="type_os" list="positions" placeholder="ホール／キッチン／店長 など" /></label>
            </div>
            <div class="row">
              <label>勤務形態
                <select name="work_style">
                  <option value="onsite">店舗勤務</option>
                  <option value="online">オンライン</option>
                  <option value="both">どちらも</option>
                </select>
              </label>
              <label>希望勤務地<input name="location" placeholder="東京" /></label>
              <label>稼働状況
                <select name="availability">
                  <option value="available">即勤務可</option>
                  <option value="assigned">勤務中</option>
                  <option value="unavailable">対応不可</option>
                </select>
              </label>
            </div>
            <label>プロフィール<textarea name="profile" rows="2"></textarea></label>
            <button class="primary" type="submit">登録</button>
          </form>
        </div>
        <div class="panel">
          <h2>人材一覧</h2>
          <div id="talents-list" class="list"></div>
        </div>
      </div>
    </section>

    <!-- ========== 店舗 ========== -->
    <section id="tab-clients" class="tab-panel">
      <div class="grid-2">
        <div class="panel">
          <h2>店舗登録</h2>
          <form id="client-form">
            <label>店舗名<input name="name" required placeholder="居酒屋 炭火屋 蔵" /></label>
            <div class="row">
              <label>区分
                <select name="kind">
                  <option value="new">新規開拓</option>
                  <option value="existing">既存顧客</option>
                </select>
              </label>
              <label>業態<input name="industry" placeholder="居酒屋／カフェ／寿司 など" /></label>
            </div>
            <div class="row">
              <label>担当者<input name="contact_name" /></label>
              <label>メール<input name="contact_email" type="email" /></label>
            </div>
            <label>電話<input name="phone" /></label>
            <label>メモ<textarea name="notes" rows="2"></textarea></label>
            <button class="primary" type="submit">登録</button>
          </form>
        </div>
        <div class="panel">
          <h2>店舗一覧</h2>
          <div id="clients-list" class="list"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
